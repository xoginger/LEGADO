<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0%" stop-color="#1c3a2f"/>
      <stop offset="55%" stop-color="#102018"/>
      <stop offset="100%" stop-color="#0a1410"/>
    </linearGradient>
    <linearGradient id="glow" x1="0.7" y1="0.1" x2="0.3" y2="0.9">
      <stop offset="0%" stop-color="#c9a45c" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#c9a45c" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ridge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2f5646"/>
      <stop offset="100%" stop-color="#13241c"/>
    </linearGradient>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <rect width="1200" height="720" fill="url(#sky)"/>
  <circle cx="880" cy="180" r="160" fill="url(#glow)" filter="url(#soft)"/>

  <!-- Distant canopy silhouette -->
  <path fill="#163028" d="M0 420 C120 380 180 400 280 370 C360 345 420 360 520 340 C640 315 720 350 820 330 C960 300 1040 340 1200 310 L1200 720 L0 720 Z"/>
  <path fill="url(#ridge)" d="M0 500 C140 460 220 490 340 455 C460 420 540 470 680 440 C820 410 920 460 1200 420 L1200 720 L0 720 Z"/>

  <!-- Memory threads / handwriting continuum -->
  <g fill="none" stroke="#d7e4dc" stroke-linecap="round" opacity="0.35">
    <path stroke-width="1.6" d="M620 250 C700 230 760 270 820 250 C880 230 930 255 980 245"/>
    <path stroke-width="1.2" d="M640 280 C710 265 770 295 840 278 C900 262 950 285 1010 270"/>
    <path stroke-width="1" d="M660 310 C730 300 790 325 860 308 C920 292 970 318 1035 300"/>
  </g>
  <g fill="none" stroke="#c9a45c" stroke-linecap="round" opacity="0.45">
    <path stroke-width="1.4" d="M700 200 C760 185 810 210 870 195 C920 182 960 200 1010 190"/>
  </g>

  <!-- Soft foreground mist -->
  <ellipse cx="900" cy="560" rx="420" ry="90" fill="#d7e4dc" opacity="0.06" filter="url(#soft)"/>
  <ellipse cx="200" cy="620" rx="360" ry="70" fill="#7a9f88" opacity="0.08" filter="url(#soft)"/>
</svg>
